<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Árbol de widgets (respaldo sin WebGL)</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg{display:block;width:100%;height:100%}
.l{stroke:#2A4366;stroke-width:4}
.n{fill:#16273F;stroke:#3B82F6;stroke-width:4;animation:g 3s infinite}
@keyframes g{0%,70%,100%{fill:#16273F}35%{fill:#3B82F6}}
.d1{animation-delay:.75s}.d2{animation-delay:1.5s}
rect,text{transition:fill .4s,stroke .4s}
</style>
</head>
<body>
<svg id="portada" viewBox="0 0 752 720" preserveAspectRatio="xMidYMid meet" hidden>
<line class="l" x1="376" y1="90" x2="196" y2="300"/><line class="l" x1="376" y1="90" x2="556" y2="300"/>
<line class="l" x1="196" y1="300" x2="96" y2="520"/><line class="l" x1="196" y1="300" x2="296" y2="520"/>
<line class="l" x1="556" y1="300" x2="456" y2="520"/><line class="l" x1="556" y1="300" x2="656" y2="520"/>
<circle class="n" cx="376" cy="90" r="44"/>
<circle class="n d1" cx="196" cy="300" r="38"/><circle class="n d1" cx="556" cy="300" r="38"/>
<circle class="n d2" cx="96" cy="520" r="32"/><circle class="n d2" cx="296" cy="520" r="32"/><circle class="n d2" cx="456" cy="520" r="32"/><circle class="n d2" cx="656" cy="520" r="32"/>
<circle r="12" fill="#F59E0B"><animateMotion dur="3s" repeatCount="indefinite" path="M376 90 L196 300 L296 520"/></circle>
<circle r="12" fill="#F59E0B"><animateMotion dur="3s" repeatCount="indefinite" path="M376 90 L556 300 L656 520"/></circle>
<text x="376" y="660" text-anchor="middle" font-size="28" fill="#8FA3BF">un cambio de estado viaja por el árbol de widgets</text>
</svg>
<svg id="tipos" viewBox="0 0 880 620" preserveAspectRatio="xMidYMid meet" hidden></svg>
<script>
var modo = new URLSearchParams(location.search).get('modo') || 'portada';
document.getElementById(modo === 'tipos' ? 'tipos' : 'portada').hidden = false;
if (modo === 'tipos') {
  var N=[['MaterialApp',440,50],['Login',220,180],['Home',660,180],['Formulario',110,310],['Botón',330,310],['Filtros',550,310],['Lista',770,310],['Ojo 👁',110,440],['Tarjeta',770,440]];
  var E=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6],[3,7],[6,8]];
  var S=[['EFÍMERO: solo el ícono del ojo',[7]],['LOCAL: el formulario y sus partes',[3,4,7]],['COMPARTIDO: Filtros y Lista usan el mismo dato',[2,5,6]],['GLOBAL: toda la app (sesión, idioma, tema)',[0,1,2,3,4,5,6,7,8]]];
  var ns='http://www.w3.org/2000/svg',s=document.getElementById('tipos'),R=[],T=[];
  function el(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e;}
  E.forEach(function(e){el('line',{x1:N[e[0]][1],y1:N[e[0]][2],x2:N[e[1]][1],y2:N[e[1]][2],stroke:'#C9C3B5','stroke-width':3});});
  N.forEach(function(n){R.push(el('rect',{x:n[1]-95,y:n[2]-32,width:190,height:64,rx:16,fill:'#FFFFFF',stroke:'#C9C3B5','stroke-width':3}));var t=el('text',{x:n[1],y:n[2]+9,'text-anchor':'middle','font-size':26,fill:'#172033'});t.textContent=n[0];T.push(t);});
  var lab=el('text',{x:440,y:575,'text-anchor':'middle','font-size':30,'font-weight':700,fill:'#C2410C'});
  var i=0;function go(){var st=S[i];lab.textContent=st[0];R.forEach(function(r,k){var on=st[1].indexOf(k)>=0;r.setAttribute('fill',on?'#1D4ED8':'#FFFFFF');r.setAttribute('stroke',on?'#1D4ED8':'#C9C3B5');T[k].setAttribute('fill',on?'#F5F3EE':'#172033');});i=(i+1)%S.length;}
  go();setInterval(go,2800);
}
</script>
</body>
</html>
